name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  macos-wk-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os,pathlib,tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          tag=os.environ['RELEASE_TAG'];
          changelog=pathlib.Path('CHANGELOG.md').read_text();
          assert tag == f'v{version}', f'tag/version mismatch: {tag} != v{version}';
          assert f'## {version} - ' in changelog, f'CHANGELOG missing dated {version} heading'"

      - name: Verify promoted CWA dependency floor
        run: >-
          python -c "import pathlib,tomllib;
          dependencies=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies'];
          assert 'chatgpt-web-adapter>=0.3.1,<0.4.0' in dependencies,
          'gptty release requires chatgpt-web-adapter>=0.3.1,<0.4.0'"

      - name: Build exact gptty wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install exact wheel and public CWA dependency
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: Verify installed WK runtime
        run: python tools/installed_wk_smoke.py

  publish:
    runs-on: ubuntu-latest
    needs:
      - macos-wk-publish
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
