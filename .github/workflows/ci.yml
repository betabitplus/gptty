name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # gptty runs on macOS only: it drives ChatGPT through the adapter's WKWebView helper.
        os: [macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The adapter release gptty needs is not on PyPI; take it from its repository.
          # The exporter lives in a private repository; no test imports it.
          python -m pip install "chatgpt-web-adapter @ git+https://github.com/betabitplus/chatgpt-web-adapter@main"
          python -m pip install --no-deps -e .
          python - <<'EOF' > requirements-ci.txt
          import re
          text = open("pyproject.toml", encoding="utf-8").read()
          block = re.search(r"^dependencies = \[(.*?)^\]", text, re.S | re.M).group(1)
          skip = ("chatgpt-web-adapter", "chatgpt-conversation-exporter")
          print("\n".join(d for d in re.findall(r'"([^"]+)"', block) if not d.startswith(skip)))
          EOF
          python -m pip install -r requirements-ci.txt keyring pytest
      - name: Compile sources
        run: python -m compileall -q main.py auth_fetcher.py auth_fetcher_wait.py src tests tools
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and validate candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tools/release_gate.py --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: gptty-dist
          path: dist/*
          if-no-files-found: error
