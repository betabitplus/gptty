name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[auth,test]"

      - name: Compile sources
        run: |
          python -m compileall main.py auth_fetcher.py auth_fetcher_wait.py src tests

      - name: Run tests
        run: |
          pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke installed wheel
        run: |
          python -m pip install dist/*.whl
          gptty --version
          gptty auth status --auth missing-auth-data.json || test "$?" -eq 1

  macos-wk-installed:
    runs-on: macos-latest
    env:
      CWA_CANDIDATE_REF: prerelease/wkwebview-main-hardening
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: betabitplus/chatgpt-web-adapter
          ref: ${{ env.CWA_CANDIDATE_REF }}
          path: .cwa-candidate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build exact candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir artifacts/cwa .cwa-candidate
          python -m build --wheel --outdir artifacts/gptty .

      - name: Install exact candidate wheels
        run: |
          python -m pip install --force-reinstall artifacts/cwa/*.whl artifacts/gptty/*.whl
          python -m pip check

      - name: Verify installed WK runtime
        run: |
          python tools/installed_wk_smoke.py
